[project]
name = "zup-mining-repos"
version = "0.1.0"
description = "Mining de repositórios FastAPI no GitHub para dataset de finetuning"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "python-dotenv>=1.2.3",
    "rich>=15.0.0",
]

[project.scripts]
mine = "miner.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/miner"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
